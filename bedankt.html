<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bedankt | Switi Spang</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1c140f" />
    <link rel="icon" href="img/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="index.html"><img src="img/logo.png" alt="" class="brand-logo" />SWITI <span>SPANG</span></a>
        <nav>
          <a href="index.html#menu">Menu</a>
          <a href="index.html#hoe">Zo werkt het</a>
          <a href="index.html#story">Ons verhaal</a>
          <a href="contact.html">Contact</a>
        </nav>
        <a class="cart-trigger" href="index.html#menu">Naar het menu</a>
      </div>
    </header>

    <main class="container page-shell">
      <div class="pay-status" id="payStatus">
        <span class="big">⏳</span>
        <h1>Even je betaling checken…</h1>
      </div>
    </main>

    <footer>
      <div class="container">
        <div class="footer-bottom">
          <span>© 2026 Switi Spang · Almere-Buiten<span data-kvk></span> · Foto's zijn serveersuggesties</span>
          <span><a href="contact.html">Contact</a> · <a href="allergenen.html">Allergenen</a> · <a href="voorwaarden.html">Algemene voorwaarden</a> · <a href="privacy.html">Privacy</a></span>
        </div>
      </div>
    </footer>

    <script src="app.js" defer></script>
  
    <script>
    (function () {
      var WA = '31624584854';
      var box = document.getElementById('payStatus');
      var id = new URLSearchParams(location.search).get('id') || '';
      var saved = null;
      try { saved = JSON.parse(sessionStorage.getItem('ss_order')); } catch (e) {}
      var tries = 0;
      function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
      function show(icon, title, html) { box.innerHTML = '<span class="big">' + icon + '</span><h1>' + title + '</h1>' + (html || ''); }
      function check() {
        if (!/^tr_/.test(id)) return show('🤔', 'Geen betaling gevonden', '<p>Heb je al betaald? Stuur ons even een WhatsApp, dan zoeken we het uit.</p><a class="checkout-btn wa" href="https://wa.me/' + WA + '">WhatsApp ons</a>');
        fetch('/api/status?id=' + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (p) {
          if (p.error) throw new Error(p.error);
          var amount = '€' + Number(p.amount).toFixed(2).replace('.', ',');
          if (p.status === 'paid') {
            var msg = p.order || (saved && saved.id === id && saved.msg) || '';
            show('✅', 'Bedankt voor je bestelling!', '<p>We hebben ' + amount + ' ontvangen' + (p.testmode ? ' <strong>(testbetaling)</strong>' : '') + '. Je bestelling is binnen en we gaan ermee aan de slag.' + (p.email && p.mail ? ' Een bevestiging met je ophaaltijd en het afhaaladres is onderweg naar <strong>' + esc(p.email) + '</strong>. Zie je niets? Kijk ook in je spam, of app ons.' : ' Het afhaaladres en je bevestiging sturen we je persoonlijk via WhatsApp of telefoon. Heb je binnen een kwartier niets gehoord, app ons dan even.') + '</p><pre>' + esc(msg) + '</pre><p>Vragen of iets aanpassen? <a href="https://wa.me/' + WA + '" target="_blank" rel="noreferrer">App ons</a> op 06 24 58 48 54.</p><p style="margin-top:16px"><a href="index.html">Terug naar de site</a></p>');
            try { sessionStorage.removeItem('ss_order'); } catch (e) {}
          } else if ((p.status === 'open' || p.status === 'pending' || p.status === 'authorized') && tries++ < 10) {
            show('⏳', 'We wachten op je betaling…', '<p>Dit duurt meestal een paar seconden.</p>');
            setTimeout(check, 3000);
          } else if (p.status === 'open' || p.status === 'pending') {
            show('⏳', 'Je betaling is nog niet binnen', '<p>Ververs deze pagina over een minuutje. Lukt het niet, stuur ons dan even een WhatsApp.</p><a class="checkout-btn wa" href="https://wa.me/' + WA + '">WhatsApp ons</a>');
          } else {
            show('❌', 'Betaling niet gelukt', '<p>Er is niets afgeschreven. Je bestelling staat nog klaar, probeer het gerust opnieuw.</p><a class="checkout-btn" href="index.html?betaling=geannuleerd">Terug naar mijn mandje</a>');
          }
        }).catch(function (e) {
          show('⚠️', 'Even mis', '<p>' + esc(e.message) + '</p><a class="checkout-btn wa" href="https://wa.me/' + WA + '">WhatsApp ons</a>');
        });
      }
      check();
    })();
    </script>
  </body>
</html>
